name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the declared npm version
        run: npm install --global npm@12.1.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Generate Prisma client
        run: npm run generate --workspace @repo/database

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build contracts package
        run: npm run build --workspace @repo/contracts

      - name: Build database package
        run: npm run build --workspace @repo/database

      - name: Build Next.js app
        run: npm run build --workspace client

      - name: Type-check NestJS app
        run: npx tsc -p apps/server/tsconfig.build.json --noEmit
